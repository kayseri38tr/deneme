<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribd Belge Çıkarıcı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #94a3b8; }
        #status { margin-top: 15px; font-size: 0.9em; color: #475569; }
    </style>
</head>
<body>

<div class="card">
    <h2>Scribd Belge İndirici</h2>
    <input type="text" id="scribd-url" placeholder="https://www.scribd.com/document/..." value="https://www.scribd.com/document/1001604550/Di-zgi-Meb-Ags-Zeki-Tu%C4%9Fa-Tari-h-Sb-2026">
    <button id="btn" onclick="processDocument()">Belgeyi İndir</button>
    <div id="status"></div>
</div>

<script>
async function processDocument() {
    const url = document.getElementById('scribd-url').value;
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');

    if (!url.includes('scribd.com')) {
        alert('Lütfen geçerli bir Scribd adresi girin.');
        return;
    }

    btn.disabled = true;
    status.innerText = "Scribd sayfası taranıyor ve parçalar toplanıyor...";

    try {
        // CORS Proxy kullanarak Scribd HTML sayfasını çekiyoruz
        const proxyUrl = 'https://api.cors.lol/?url=' + encodeURIComponent(url);
        const response = await fetch(proxyUrl);
        const htmlText = await response.text();

        // Sayfa içerisindeki görsel/page uzantılarını regex ile arıyoruz
        const imgMatches = htmlText.match(/https:\/\/html\.scribdassets\.com\/[a-z0-0]+\/images\/[a-z0-9-]+\.(jpg|png)/g);

        if (!imgMatches || imgMatches.length === 0) {
            status.innerText = "Hata: Korumalı içerik veya önizleme görselleri doğrudan okunamadı. Harici API gerekli.";
            btn.disabled = false;
            return;
        }

        // Tekrarlayan görselleri temizle
        const uniqueImages = [...new Set(imgMatches)];
        status.innerText = `${uniqueImages.length} adet sayfa görseli bulundu. PDF oluşturuluyor...`;

        // jsPDF ile sayfaları tek PDF'e dönüştürme
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();

        for (let i = 0; i < uniqueImages.length; i++) {
            if (i > 0) pdf.addPage();
            status.innerText = `Sayfa ${i + 1} / ${uniqueImages.length} işleniyor...`;
            
            // Görseli Base64'e çevirip PDF'e ekleme
            const imgData = await getBase64Image(uniqueImages[i]);
            pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
        }

        pdf.save("scribd-belge.pdf");
        status.innerText = "İndirme tamamlandı!";
    } catch (err) {
        status.innerText = "Bir hata oluştu: " + err.message;
    } finally {
        btn.disabled = false;
    }
}

function getBase64Image(imgUrl) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = 'https://api.cors.lol/?url=' + encodeURIComponent(imgUrl);
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/jpeg'));
        };
        img.onerror = error => reject(error);
    });
}
</script>

</body>
</html>
