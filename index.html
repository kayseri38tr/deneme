<!doctype html>

    <title>YouTune Türkiye (SafeShare Player)</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #181818;
        --surface-2: #242424;
        --line: #303030;
        --text: #f1f1f1;
        --muted: #a9a9a9;
        --accent: #ff1932;
        --accent-soft: rgba(255, 25, 50, 0.16);
        --radius: 14px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .app-shell { min-height: 100vh; padding-bottom: 82px; }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 24px;
        min-height: 64px;
        padding: 10px 28px;
        background: rgba(15, 15, 15, 0.94);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: max-content;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 29px;
        height: 21px;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-size: 13px;
      }
      .search-form {
        display: flex;
        flex: 1;
        max-width: 710px;
        margin: 0 auto;
      }
      .search-form input {
        width: 100%;
        height: 40px;
        padding: 0 16px;
        color: var(--text);
        background: #121212;
        border: 1px solid #3a3a3a;
        border-right: 0;
        border-radius: 22px 0 0 22px;
        outline: none;
      }
      .search-form input:focus { border-color: var(--accent); }
      .search-form button {
        width: 54px;
        border: 1px solid #3a3a3a;
        border-radius: 0 22px 22px 0;
        background: var(--surface-2);
        color: var(--text);
      }
      .search-form button:hover { color: var(--accent); }
      .header-action {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        color: var(--text);
        background: transparent;
        font-size: 20px;
      }
      .header-action:hover { background: var(--surface-2); }

      main { width: min(1500px, calc(100% - 48px)); margin: 0 auto; padding-top: 26px; }
      body.has-player main { padding-top: 548px; }
      .inline-player {
        position: fixed;
        top: 64px;
        right: 0;
        left: 0;
        z-index: 9;
        width: auto;
        max-height: calc(100vh - 64px);
        overflow-y: auto;
        margin: 0;
        padding: 8px max(12px, calc((100vw - 900px) / 2)) 14px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        box-shadow: 0 12px 28px rgba(0, 0, 0, .28);
      }
      .inline-player-frame {
        width: min(854px, 100%);
        margin: 0 auto;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 11px;
        background: #000;
      }
      .inline-player-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
      .inline-player-details {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 4px 2px;
      }
      .inline-player-details h2 { margin: 0 0 6px; font-size: 19px; }
      .inline-player-details p { margin: 0; color: var(--muted); font-size: 13px; }
      .inline-player-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .inline-player-actions button, .inline-player-actions a {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 18px;
        color: var(--text);
        background: var(--surface-2);
        text-decoration: none;
      }
      .inline-player-actions button:hover, .inline-player-actions a:hover,
      .inline-player-actions .selected {
        border-color: var(--accent);
        color: white;
        background: var(--accent-soft);
      }
      .hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 0 0 24px;
      }
      h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); letter-spacing: -1.4px; }
      .hero p { margin: 8px 0 0; color: var(--muted); }
      .result-count { color: var(--muted); font-size: 14px; white-space: nowrap; }
      .categories {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 3px 0 22px;
        scrollbar-width: none;
      }
      .categories::-webkit-scrollbar { display: none; }
      .category {
        flex: 0 0 auto;
        padding: 9px 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        color: var(--text);
        background: var(--surface);
      }
      .category:hover, .category.active {
        border-color: var(--accent);
        color: white;
        background: var(--accent);
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 28px 18px;
      }
      .video-card {
        min-width: 0;
        border-radius: var(--radius);
        outline: none;
        content-visibility: auto;
        contain-intrinsic-size: 260px;
      }
      .video-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .thumbnail-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: var(--radius);
        background: #292929;
      }
      .thumbnail-wrap img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        contain: paint;
      }
      .card-favorite {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 50%;
        color: white;
        background: rgba(0, 0, 0, .72);
        font-size: 19px;
        line-height: 1;
        transition: transform .2s ease, color .2s ease, background .2s ease;
      }
      .card-favorite:hover, .card-favorite.selected {
        color: white;
        background: var(--accent);
        transform: scale(1.08);
      }
      .duration {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 3px 6px;
        border-radius: 4px;
        color: white;
        background: rgba(0, 0, 0, .85);
        font-size: 12px;
        font-weight: 700;
      }
      .play-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        background: rgba(0, 0, 0, .38);
        opacity: 0;
        transition: opacity .2s ease;
        font-size: 42px;
      }
      .video-card:hover .play-overlay, .video-card:focus-visible .play-overlay { opacity: 1; }
      .video-info { display: flex; gap: 11px; padding: 11px 2px 0; }
      .channel-avatar {
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(135deg, #ef4444, #7f1d1d);
        font-weight: 800;
      }
      .video-copy { min-width: 0; }
      .video-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 5px;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .video-meta { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
      .empty {
        display: none;
        padding: 90px 20px;
        color: var(--muted);
        text-align: center;
      }
      .empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 20px; }
      .load-more {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin: 38px 0 20px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      .load-more.visible { display: flex; }
      .load-more button {
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 22px;
        color: var(--text);
        background: var(--surface);
        font-weight: 700;
      }
      .load-more button:hover { border-color: var(--accent); background: var(--accent); }
      .load-more button:disabled { cursor: wait; opacity: .6; }
      .loaded-count { color: var(--muted); font-size: 13px; }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        gap: 100px;
        min-height: 64px;
        padding: 8px;
        border-top: 1px solid var(--line);
        background: rgba(24, 24, 24, .96);
      }
      .nav-button {
        min-width: 90px;
        border: 0;
        color: var(--muted);
        background: transparent;
      }
      .nav-button span { display: block; margin-bottom: 2px; font-size: 20px; }
      .nav-button.active, .nav-button:hover { color: var(--accent); }

      @media (max-width: 650px) {
        header { gap: 10px; padding: 9px 13px; }
        .brand { font-size: 16px; }
        .header-action { display: none; }
        main { width: min(100% - 26px, 1500px); padding-top: 20px; }
        body.has-player main { padding-top: calc(56.25vw + 154px); }
        .inline-player {
          top: 62px;
          padding: 6px 13px 14px;
        }
        .inline-player-frame { border-radius: 8px; }
        .inline-player-details { display: block; padding: 10px 3px 2px; }
        .inline-player-details h2 { font-size: 15px; }
        .inline-player-details p { font-size: 11px; }
        .inline-player-actions { margin-top: 10px; }
        .inline-player-actions button, .inline-player-actions a { padding: 7px 10px; font-size: 12px; }
        .hero { display: block; }
        .result-count { display: block; margin-top: 12px; }
        .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 10px; }
        .video-info { gap: 7px; padding-top: 8px; }
        .channel-avatar { display: none; }
        .video-title { font-size: 13px; }
        .video-meta { font-size: 11px; }
        .bottom-nav { gap: 18px; justify-content: space-around; }
      }
    </style>

      let homeVideos = videos.slice();
      let homeIsTrending = false;
      let homeLoading = true;
      
      function shuffleVideos(videoList) {
        const shuffled = videoList.slice();
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
        }
        return shuffled;
      }
      
      homeVideos = shuffleVideos(homeVideos);
      let activeCategory = "Tümü";
      let activeVideo = null;
      let mode = "home";
      let searchTerm = "";
      let remoteVideos = null;
      let searchPage = 0;
      let hasMoreSearchResults = false;
      let searchLoading = false;
      let remoteQuery = "";

      const grid = document.querySelector("#videoGrid");
      const emptyState = document.querySelector("#emptyState");
      const resultCount = document.querySelector("#resultCount");
      const categoriesEl = document.querySelector("#categories");
      const searchInput = document.querySelector("#searchInput");
      const playerFrame = document.querySelector("#playerFrame");
      const favoriteButton = document.querySelector("#favoriteButton");

      function getStored(key) {
        try { return JSON.parse(localStorage.getItem(key) || "[]"); }
        catch (_) { return []; }
      }
      function setStored(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch (_) { }
      }
      function isFavorite(id) { return getStored("youtune-favorites").includes(id); }

      function getFavoriteVideos() {
        const favoriteIds = getStored("youtune-favorites");
        const storedVideos = getStored("youtune-favorite-videos");
        const availableVideos = [...storedVideos, ...homeVideos, ...videos];
        const videosById = new Map(availableVideos.map((video) => [video.id, video]));
        return favoriteIds.map((id) => videosById.get(id)).filter(Boolean);
      }

      function toggleFavorite(video) {
        const favoriteIds = getStored("youtune-favorites");
        const favoriteVideos = getStored("youtune-favorite-videos");
        const alreadyFavorite = favoriteIds.includes(video.id);
        const nextIds = alreadyFavorite
          ? favoriteIds.filter((id) => id !== video.id)
          : [video.id, ...favoriteIds];
        const nextVideos = alreadyFavorite
          ? favoriteVideos.filter((item) => item.id !== video.id)
          : [video, ...favoriteVideos.filter((item) => item.id !== video.id)];
        setStored("youtune-favorites", nextIds);
        setStored("youtune-favorite-videos", nextVideos);
      }

      function filteredVideos() {
        const term = searchTerm.trim().toLocaleLowerCase("tr-TR");
        const sourceVideos = mode === "favorites"
          ? getFavoriteVideos()
          : remoteVideos || homeVideos;
        return sourceVideos.filter((video) => {
          const categoryMatch = activeCategory === "Tümü" || video.category === activeCategory;
          const text = `${video.title} ${video.channel} ${video.category}`.toLocaleLowerCase("tr-TR");
          const searchMatch = !term || text.includes(term);
          const modeMatch = mode === "home" || mode === "favorites" || getStored("youtune-history").includes(video.id);
          return categoryMatch && searchMatch && modeMatch;
        });
      }

      function formatDuration(seconds) {
        if (!seconds || seconds < 0) return "";
        if (typeof seconds === "string") return seconds;
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds < 10 ? "0" : ""}${remainingSeconds}`;
      }

      function formatViews(views) {
        if (!views && views !== 0) return "";
        if (typeof views === "string") return views;
        if (views >= 1000000) return `${(views / 1000000).toFixed(1)} Mn görüntüleme`;
        if (views >= 1000) return `${(views / 1000).toFixed(0)} B görüntüleme`;
        return `${views} görüntüleme`;
      }

      function getVideoId(item) {
        let id = item.videoId || "";
        if (!id && item.url) {
          const match = item.url.match(/[?&]v=([^&]+)/);
          id = match ? match[1] : item.url.replace("/watch?v=", "").split("&")[0];
        }
        return id;
      }

      async function fetchTrending() {
        let lastError;

        for (const endpoint of TRENDING_ENDPOINTS) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5500);
            const fetchUrl = endpoint.type === "piped"
              ? endpoint.url
              : `${endpoint.url}&type=video`;
            const response = await fetch(fetchUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) continue;

            const data = await response.json();
            const rawItems = Array.isArray(data) ? data : (data.items || []);
            const results = rawItems.map((item) => ({
              id: getVideoId(item),
              title: item.title || "Başlıksız",
              channel: item.uploaderName || item.author || "Kanal",
              views: formatViews(item.views ?? item.viewCount),
              age: item.uploadedDate || item.publishedText || "",
              duration: formatDuration(item.duration ?? item.lengthSeconds),
              category: "Trend"
            })).filter((video) => video.id);

            if (results.length) return results.slice(0, 60);
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error("Türkiye trend videolarına şu an erişilemiyor.");
      }

      async function fetchSearch(query, page = 1) {
        let lastError;

        for (const endpoint of SEARCH_ENDPOINTS) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4500);
            const fetchUrl = endpoint.type === "piped"
              ? `${endpoint.url}?q=${encodeURIComponent(query)}&filter=videos&page=${page}`
              : `${endpoint.url}?q=${encodeURIComponent(query)}&type=video&page=${page}`;

            const response = await fetch(fetchUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) continue;

            const data = await response.json();
            const rawItems = Array.isArray(data) ? data : (data.items || []);
            if (!rawItems.length) continue;

            return rawItems.map((item) => {
              const id = getVideoId(item);

              return {
                id,
                title: item.title || "Başlıksız",
                channel: item.uploaderName || item.author || "Kanal",
                views: formatViews(item.views ?? item.viewCount),
                age: item.uploadedDate || item.publishedText || "",
                duration: formatDuration(item.duration ?? item.lengthSeconds),
                category: "Arama"
              };
            }).filter((video) => video.id);
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error("Arama sunucularına şu an erişilemiyor.");
      }

      function renderCategories() {
        const sourceCategories = mode === "favorites"
          ? ["Tümü"]
          : remoteVideos
          ? ["Tümü", "Arama"]
          : homeIsTrending
            ? ["Tümü", "Trend"]
            : categories;
        categoriesEl.innerHTML = sourceCategories.map((category) => `
          <button class="category ${activeCategory === category ? "active" : ""}" type="button" data-category="${category}">
            ${category}
          </button>
        `).join("");
      }

      function renderVideos() {
        const isHomeList = !remoteVideos && mode === "home";
        const allVisibleVideos = homeLoading && isHomeList ? [] : filteredVideos();
        const visibleVideos = isHomeList
          ? allVisibleVideos.slice(0, homeVisibleCount)
          : allVisibleVideos;
        if (homeLoading && isHomeList) {
          resultCount.textContent = "Türkiye trend videoları yükleniyor...";
          emptyState.innerHTML = "<strong>Güncel videolar getiriliyor...</strong>Türkiye trend listesi hazırlanıyor.";
          emptyState.style.display = "block";
        } else {
          resultCount.textContent = remoteVideos && remoteQuery
            ? `${visibleVideos.length} / ${remoteVideos.length} video`
            : isHomeList && visibleVideos.length < allVisibleVideos.length
              ? `${visibleVideos.length} / ${allVisibleVideos.length} video`
              : `${visibleVideos.length} video`;
          emptyState.style.display = visibleVideos.length || mode === "favorites" ? "none" : "block";
        }
        grid.innerHTML = visibleVideos.map((video) => `
          <article class="video-card" tabindex="0" role="button" data-video-id="${video.id}" aria-label="${video.title}">
            <div class="thumbnail-wrap">
              <img src="https://i.ytimg.com/vi/${video.id}/mqdefault.jpg" alt="" width="320" height="180"
                loading="lazy" decoding="async"
                onerror="this.onerror=null; this.src='https://i.ytimg.com/vi/${video.id}/default.jpg'" />
              <button class="card-favorite ${isFavorite(video.id) ? "selected" : ""}" type="button"
                data-favorite-id="${video.id}" aria-label="${isFavorite(video.id) ? "Favorilerden çıkar" : "Favorilere ekle"}">
                ${isFavorite(video.id) ? "♥" : "♡"}
              </button>
              <span class="play-overlay">▶</span>
              <span class="duration">${video.duration}</span>
            </div>
            <div class="video-info">
              <div class="channel-avatar">${video.channel.charAt(0)}</div>
              <div class="video-copy">
                <h2 class="video-title">${video.title}</h2>
                <p class="video-meta">${video.channel}<br>${video.views} • ${video.age}</p>
              </div>
            </div>
          </article>
        `).join("");

        const loadMoreBox = document.querySelector("#loadMoreBox");
        const loadedCount = document.querySelector("#loadedCount");
        const loadMoreButton = document.querySelector("#loadMoreButton");
        const showHomeLoadMore = Boolean(isHomeList && allVisibleVideos.length);
        const showSearchLoadMore = Boolean(mode === "home" && remoteVideos && remoteQuery && remoteVideos.length);
        const showLoadMore = showHomeLoadMore || showSearchLoadMore;
        loadMoreBox.classList.toggle("visible", showLoadMore);
        loadedCount.textContent = showHomeLoadMore
          ? `${visibleVideos.length} / ${allVisibleVideos.length} ana sayfa videosu gösteriliyor`
          : showSearchLoadMore
            ? `${remoteVideos.length} sonuç yüklendi • en fazla 400 video`
            : "";
        loadMoreButton.hidden = isHomeList
          ? visibleVideos.length >= allVisibleVideos.length
          : !hasMoreSearchResults;
        loadMoreButton.disabled = searchLoading;
        loadMoreButton.textContent = searchLoading
          ? "Yükleniyor..."
          : "Daha fazla yükle";
      }

      async function loadTrendingVideos() {
        renderVideos();
        try {
          const results = await fetchTrending();
          homeVideos = shuffleVideos(results);
          homeIsTrending = true;
          homeVisibleCount = HOME_PAGE_SIZE;
          activeCategory = "Tümü";
          renderCategories();
        } catch (error) {
          homeIsTrending = false;
          console.warn("Türkiye trend videoları alınamadı, yedek liste kullanılıyor:", error.message);
        } finally {
          homeLoading = false;
          renderVideos();
        }
      }

      function openVideo(id) {
        activeVideo = (remoteVideos || homeVideos).find((video) => video.id === id);
        if (!activeVideo) return;
        const history = getStored("youtune-history").filter((item) => item !== id);
        setStored("youtune-history", [id, ...history].slice(0, 30));
        
        setCookie("last_watched_video", id, 30);

        document.body.classList.add("has-player");
        document.querySelector("#inlinePlayer").hidden = false;

        document.querySelector("#playerTitle").textContent = activeVideo.title;
        document.querySelector("#playerMeta").textContent = `${activeVideo.channel} • ${activeVideo.views} • ${activeVideo.age}`;
        
        // SafeShare Bağlantısı
        document.querySelector("#safeshareButton").href = `${SAFESHARE_BASE_URL}/v/${encodeURIComponent(id)}`;
        
        favoriteButton.textContent = isFavorite(id) ? "♥ Favorilerden çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", isFavorite(id));
        
        // YouTube veya nocookie oynatıcısı yerine SafeShare Player yapısına geçiş
        const iframe = document.createElement("iframe");
        iframe.src = `${SAFESHARE_BASE_URL}/x/${encodeURIComponent(id)}`;
        iframe.title = activeVideo.title;
        iframe.loading = "eager";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        playerFrame.replaceChildren(iframe);
      }

      function setMode(nextMode) {
        mode = nextMode;
        if (nextMode === "favorites") activeCategory = "Tümü";
        document.querySelectorAll(".nav-button").forEach((button) => button.classList.remove("active"));
        document.querySelector(`#${nextMode === "home" ? "homeButton" : nextMode === "favorites" ? "favoritesButton" : "historyButton"}`).classList.add("active");
        renderCategories();
        renderVideos();
      }

      document.querySelector("#searchForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();
        const submitButton = event.currentTarget.querySelector("button");

        if (query.length < 2) {
          remoteVideos = null;
          searchPage = 0;
          hasMoreSearchResults = false;
          remoteQuery = "";
          searchTerm = "";
          mode = "home";
          homeVisibleCount = HOME_PAGE_SIZE;
          activeCategory = "Tümü";
          renderCategories();
          renderVideos();
          return;
        }

        submitButton.disabled = true;
        resultCount.textContent = "Aranıyor...";
        emptyState.innerHTML = "<strong>Aranıyor...</strong>Sonuçlar getiriliyor.";
        emptyState.style.display = "block";

        try {
          const results = await fetchSearch(query, 1);
          remoteVideos = results.slice(0, 20);
          searchPage = 1;
          hasMoreSearchResults = results.length >= 20;
          remoteQuery = query;
          searchTerm = "";
          activeCategory = "Tümü";
          mode = "home";
          renderCategories();
          renderVideos();
        } catch (error) {
          remoteVideos = null;
          resultCount.textContent = "Arama başarısız";
          emptyState.innerHTML = `<strong>Arama yapılamadı</strong>${error.message || "Lütfen tekrar deneyin."}`;
          emptyState.style.display = "block";
        } finally {
          submitButton.disabled = false;
        }
      });

      document.querySelector("#loadMoreButton").addEventListener("click", async () => {
        if (!remoteVideos && mode === "home") {
          const homeResults = filteredVideos();
          if (homeVisibleCount < homeResults.length) {
            homeVisibleCount = Math.min(homeVisibleCount + HOME_PAGE_SIZE, homeResults.length);
            renderVideos();
          }
          return;
        }

        if (!remoteQuery || !hasMoreSearchResults || searchLoading || !remoteVideos || remoteVideos.length >= 400) return;
        searchLoading = true;
        renderVideos();

        try {
          const results = await fetchSearch(remoteQuery, searchPage + 1);
          const nextVideos = [...remoteVideos, ...results];
          remoteVideos = Array.from(new Map(nextVideos.map((video) => [video.id, video])).values()).slice(0, 400);
          searchPage += 1;
          hasMoreSearchResults = results.length >= 20 && remoteVideos.length < 400;
          renderCategories();
          renderVideos();
        } catch (error) {
          hasMoreSearchResults = false;
          resultCount.textContent = "Daha fazla sonuç alınamadı";
          document.querySelector("#loadedCount").textContent = error.message || "Lütfen tekrar deneyin.";
        } finally {
          searchLoading = false;
          renderVideos();
        }
      });
      
      categoriesEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        if (!remoteVideos && mode === "home") homeVisibleCount = HOME_PAGE_SIZE;
        renderCategories();
        renderVideos();
      });
      
      grid.addEventListener("click", (event) => {
        const favoriteControl = event.target.closest("[data-favorite-id]");
        if (favoriteControl) {
          event.stopPropagation();
          const video = (remoteVideos || homeVideos).find((item) => item.id === favoriteControl.dataset.favoriteId)
            || getFavoriteVideos().find((item) => item.id === favoriteControl.dataset.favoriteId);
          if (video) {
            toggleFavorite(video);
            favoriteControl.classList.toggle("selected", isFavorite(video.id));
            favoriteControl.textContent = isFavorite(video.id) ? "♥" : "♡";
            favoriteControl.setAttribute("aria-label", isFavorite(video.id) ? "Favorilerden çıkar" : "Favorilere ekle");
            if (mode === "favorites") renderVideos();
          }
          return;
        }
        const card = event.target.closest("[data-video-id]");
        if (card) openVideo(card.dataset.videoId);
      });
      
      grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-video-id]");
        if (card) { event.preventDefault(); openVideo(card.dataset.videoId); }
      });
      
      favoriteButton.addEventListener("click", () => {
        if (!activeVideo) return;
        toggleFavorite(activeVideo);
        favoriteButton.textContent = isFavorite(activeVideo.id) ? "♥ Favorilerden çıkar" : "♡ Favorile";
        favoriteButton.classList.toggle("selected", isFavorite(activeVideo.id));
        renderVideos();
      });
      
      document.querySelector("#shareButton").addEventListener("click", async () => {
        if (!activeVideo) return;
        const url = `${SAFESHARE_BASE_URL}/v/${activeVideo.id}`;
        if (navigator.share) await navigator.share({ title: activeVideo.title, url });
        else { await navigator.clipboard?.writeText(url); alert("SafeShare bağlantısı kopyalandı."); }
      });
      
      document.querySelector("#homeButton").addEventListener("click", () => setMode("home"));
      document.querySelector("#favoritesButton").addEventListener("click", () => setMode("favorites"));
      document.querySelector("#historyButton").addEventListener("click", () => setMode("history"));

      renderCategories();
      renderVideos();
      
      const runWhenIdle = window.requestIdleCallback || ((callback) => setTimeout(callback, 1200));
      runWhenIdle(loadTrendingVideos);
    </script>
  </body>
</html>
