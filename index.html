<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeView - Invidious API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        /* Safe Player */
        #player-container {
            width: 100%;
            max-width: 900px;
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .close-btn {
            align-self: flex-end;
            background-color: #ef4444;
        }
        
        .close-btn:hover {
            background-color: #dc2626;
        }

        /* Sonuç Listesi */
        #results-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .badge {
            align-self: flex-start;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-video { background-color: #0284c7; color: white; }
        .badge-channel { background-color: #16a34a; color: white; }
        .badge-playlist { background-color: #d97706; color: white; }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            color: #f1f5f9;
        }

        .card-channel {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        #status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <h1>SafeView (Invidious API)</h1>
        <div class="search-box">
            <input type="text" id="query" placeholder="Video, kanal veya oynatma listesi ara..." onkeypress="if(event.key==='Enter') searchInvidious()">
            <button onclick="searchInvidious()">Ara</button>
        </div>
        <div id="status-msg"></div>
    </header>

    <!-- Safe Player -->
    <div id="player-container">
        <button class="close-btn" onclick="closePlayer()">Oynatıcıyı Kapat</button>
        <div class="responsive-iframe">
            <iframe id="safe-player" src="" allowfullscreen></iframe>
        </div>
        <h3 id="player-title" style="margin-top: 10px;"></h3>
    </div>

    <!-- Arama Sonuçları -->
    <div id="results-container"></div>

    <script>
        // Aktif Invidious sunucularının listesi
        const instances = [
            'https://invidious.nerdvpn.de',
            'https://inv.tux.pizza',
            'https://invidious.drgns.space',
            'https://vid.puffyan.us'
        ];
        
        let currentInstanceIndex = 0;

        async function searchInvidious() {
            const query = document.getElementById('query').value;
            const statusMsg = document.getElementById('status-msg');
            if (!query) return;

            statusMsg.innerText = 'Aranıyor...';

            // Çalışan bir instance bulana kadar dene
            for (let i = 0; i < instances.length; i++) {
                const instance = instances[(currentInstanceIndex + i) % instances.length];
                const url = `${instance}/api/v1/search?q=${encodeURIComponent(query)}`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Sunucu yanıt vermedi');
                    
                    const data = await response.json();
                    currentInstanceIndex = (currentInstanceIndex + i) % instances.length; // Başarılı sunucuyu kaydet
                    statusMsg.innerText = '';
                    displayResults(data);
                    return;
                } catch (error) {
                    console.warn(`${instance} bağlantısı başarısız, sonraki sunucu deneniyor...`);
                }
            }

            statusMsg.innerText = 'Sunuculardan yanıt alınamadı. Lütfen tekrar deneyin.';
        }

        function displayResults(items) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const type = item.type; // video, playlist, channel
                let clickHandler = '';
                let badgeClass = '';
                let thumbnail = '';

                if (type === 'video') {
                    badgeClass = 'badge-video';
                    thumbnail = item.videoThumbnails ? item.videoThumbnails.find(t => t.quality === 'medium')?.url || item.videoThumbnails[0]?.url : '';
                    clickHandler = `openPlayer('video', '${item.videoId}', '${escapeHtml(item.title)}')`;
                } else if (type === 'playlist') {
                    badgeClass = 'badge-playlist';
                    thumbnail = item.playlistThumbnail || '';
                    clickHandler = `openPlayer('playlist', '${item.playlistId}', '${escapeHtml(item.title)}')`;
                } else if (type === 'channel') {
                    badgeClass = 'badge-channel';
                    thumbnail = item.authorThumbnails ? item.authorThumbnails[0]?.url : '';
                    clickHandler = `alert('Kanal içerikleri için arama çubuğunu kullanabilirsiniz.')`;
                } else {
                    return; // Bilinmeyen tipleri atla
                }

                card.setAttribute('onclick', clickHandler);

                card.innerHTML = `
                    <img src="${thumbnail}" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/300x150?text=Görsel+Yok'">
                    <div class="card-content">
                        <span class="badge ${badgeClass}">${type}</span>
                        <div class="card-title">${item.title}</div>
                        <div class="card-channel">${item.author || ''}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function openPlayer(type, id, title) {
            const playerContainer = document.getElementById('player-container');
            const iframe = document.getElementById('safe-player');
            const titleElement = document.getElementById('player-title');
            const activeInstance = instances[currentInstanceIndex];

            if (type === 'video') {
                iframe.src = `${activeInstance}/embed/${id}?autoplay=1`;
            } else if (type === 'playlist') {
                iframe.src = `${activeInstance}/embed/${id}?list=${id}`;
            }

            titleElement.innerText = title;
            playerContainer.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            const playerContainer = document.getElementById('player-container');
            const iframe = document.getElementById('safe-player');
            
            iframe.src = '';
            playerContainer.style.display = 'none';
        }

        function escapeHtml(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
        }
    </script>
</body>
</html>
